<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MyMoney" />
  <title>My Money</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ==============================================
       SCREEN 1: ONE-TIME INITIAL BALANCE SETUP
       (Shown only on very first launch)
       ============================================== -->
  <div id="setupScreen" class="screen-view">
    <div class="setup-container">
      <div class="app-icon">💰</div>
      <h1>My Personal Money</h1>
      <p class="subtitle">Enter how much money you currently have. You will do this only once.</p>

      <div class="input-card">
        <label>💵 Starting Cash in Hand</label>
        <div class="amount-field">
          <span class="currency">₹</span>
          <input type="number" id="setupCashInput" placeholder="0" inputmode="decimal" />
        </div>
      </div>

      <div class="input-card">
        <label>📱 Starting GPay Balance</label>
        <div class="amount-field">
          <span class="currency">₹</span>
          <input type="number" id="setupGpayInput" placeholder="0" inputmode="decimal" />
        </div>
      </div>

      <button id="saveSetupBtn" class="primary-btn">Save & Lock Starting Amount →</button>
    </div>
  </div>

  <!-- ==============================================
       SCREEN 2: MAIN DASHBOARD
       ============================================== -->
  <div id="mainScreen" class="screen-view hidden">
    <!-- TOP PERMANENT TOTAL DISPLAY -->
    <header class="top-balance-card">
      <div class="balance-tag">MY TOTAL MONEY</div>
      <div class="balance-huge" id="totalBalanceVal">₹0</div>

      <div class="wallet-sub-bar">
        <div class="sub-wallet">
          <span class="sub-wallet-label">💵 Cash</span>
          <span class="sub-wallet-val cash-accent" id="cashBalanceVal">₹0</span>
        </div>
        <div class="sub-divider"></div>
        <div class="sub-wallet">
          <span class="sub-wallet-label">📱 GPay</span>
          <span class="sub-wallet-val gpay-accent" id="gpayBalanceVal">₹0</span>
        </div>
      </div>
    </header>

    <!-- TABS: CASH vs GPAY -->
    <nav class="tab-header">
      <button class="tab-btn active" id="tabBtnCash">💵 Cash Tab</button>
      <button class="tab-btn" id="tabBtnGpay">📱 GPay Tab</button>
    </nav>

    <!-- CASH TAB CONTENT -->
    <main id="cashTabContent" class="tab-body active">
      <div class="panel-box">
        <h3>Cash Transactions</h3>
        <p class="panel-sub">Money only changes when you add or spend here.</p>
        <div id="cashList" class="tx-list"></div>
      </div>
    </main>

    <!-- GPAY TAB CONTENT -->
    <main id="gpayTabContent" class="tab-body">
      <div class="panel-box">
        <h3>GPay Transactions</h3>
        <p class="panel-sub">Money only changes when you add or spend here.</p>
        <div id="gpayList" class="tx-list"></div>
      </div>
    </main>

    <!-- Actions & Reset at Bottom -->
    <footer class="app-footer">
      <button id="morningReminderBtn" class="reminder-toggle-btn">🔔 5:00 AM Daily Morning Reminder: OFF</button>
      <button id="downloadExcelBtn" class="excel-download-btn">📥 Download Excel / CSV</button>
      <button id="resetAppBtn" class="text-link-btn">Reset Starting Amount</button>
    </footer>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
